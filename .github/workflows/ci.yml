name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Plain python commands (no make) so every job runs the same on Linux, macOS and Windows.
jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install (all extras + dev tools)
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check financial_model/
      - name: Type check
        run: python -m mypy financial_model/
      - name: Test
        run: python -m pytest tests/ --cov=financial_model --cov-report=xml
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml

  core-only:
    # The engine, models, exports, CLI and file provider must work without any extra.
    name: core install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install core only
        run: python -m pip install . pytest hypothesis
      - name: Assert no optional packages
        run: python -c "from financial_model.utils.optional import is_available as a; bad=[m for m in ('fastapi','uvicorn','plotly','yfinance') if a(m)]; assert not bad, bad"
      - name: Test (optional-extra modules are skipped)
        run: python -m pytest tests/ -rs
      - name: CLI smoke
        run: |
          financial-model run config/dcf_saas.yaml -o out.xlsx
          financial-model ma config/ma_saas.yaml
          financial-model fetch out.xlsx -o derived.yaml
          financial-model validate derived.yaml

  container:
    # Same OCI image from two different runtimes.
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        engine: [docker, podman]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: ${{ matrix.engine }} build -t financial-model .
      - name: Smoke test
        run: |
          ${{ matrix.engine }} run -d --name fm -p 8000:8000 -e FIN_API_KEY=ci financial-model
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/models)" = 401
          curl -fsS -H "X-API-Key: ci" http://127.0.0.1:8000/models
          ${{ matrix.engine }} rm -f fm
