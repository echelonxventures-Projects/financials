name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run against whatever is newest upstream (new Python releases, new dependency
  # versions, pre-releases), so breakage shows up before users hit it.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Plain python/pip commands (no make, no extra tools) so every job runs the same on
# Linux, macOS and Windows. Supported range: requires-python in pyproject.toml (no upper bound).
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy financial_model/

  test:
    # Oldest supported Python, every release in between, and "3.x" (always the newest
    # stable release, so a new Python is picked up without editing this file).
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.x"]
        include:
          # Python 3.9 builds are not published for the newest Ubuntu image; use the last one that has them.
          - { os: ubuntu-24.04, python-version: "3.9" }
          - { os: macos-latest, python-version: "3.9" }
          - { os: macos-latest, python-version: "3.x" }
          - { os: windows-latest, python-version: "3.9" }
          - { os: windows-latest, python-version: "3.x" }
          - { os: ubuntu-latest, python-version: "3.14t" }  # free-threaded (no GIL) build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install (all extras + dev tools)
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest tests/ --cov=financial_model --cov-report=xml
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.x'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml

  lowest-deps:
    # Every runtime dependency at the minimum pyproject.toml declares, on the oldest Python.
    name: lowest dependencies (py3.9)
    runs-on: ubuntu-24.04  # newest Ubuntu image with Python 3.9 builds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Pin dependency floors
        run: python scripts/min_constraints.py > min-constraints.txt && cat min-constraints.txt
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - run: python -m pip install -c min-constraints.txt -e ".[dev]"
      - run: python -m pytest tests/

  latest-deps:
    # Newest releases of everything, plus pre-releases of the runtime dependencies (what
    # users install), on the newest Python. Test tools stay on stable releases so a
    # pre-release clash between two test tools is not reported as our breakage.
    # Informational: an upstream pre-release breaking us must not block merges.
    name: latest + pre-release dependencies
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          allow-prereleases: true
      - run: python -m pip install --upgrade -e ".[dev]"
      - run: python -m pip install --upgrade --pre $(python scripts/min_constraints.py --names)
      - run: python -m pip list
      - run: python -m pytest tests/

  core-only:
    # The engine, models, exports, CLI and file provider must work without any extra.
    name: core install (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python-version: "3.9" }
          - { os: ubuntu-latest, python-version: "3.x" }
          - { os: windows-latest, python-version: "3.9" }
          - { os: windows-latest, python-version: "3.x" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core only
        run: python -m pip install . pytest hypothesis
      - name: Assert no optional packages
        run: python -c "from financial_model.utils.optional import is_available as a; bad=[m for m in ('fastapi','uvicorn','plotly','yfinance') if a(m)]; assert not bad, bad"
      - name: Test (optional-extra modules are skipped)
        run: python -m pytest tests/ -rs
      - name: CLI smoke
        run: |
          financial-model run config/dcf_saas.yaml -o out.xlsx
          financial-model ma config/ma_saas.yaml
          financial-model fetch out.xlsx -o derived.yaml
          financial-model validate derived.yaml

  examples:
    # The toolkit from other languages: each example runs through the CLI (stdin/stdout
    # JSON) and the REST API, and every one must report the same valuation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "ruby"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: python -m pip install ".[api]"
      - name: Run every example via the CLI and via the API
        run: |
          financial-model serve --port 8000 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health >/dev/null && break; sleep 1; done
          run_all() {
            node examples/node/valuation.mjs
            (cd examples/go && go run .)
            ruby examples/ruby/valuation.rb
            dotnet run examples/csharp/valuation.cs
          }
          ev() { grep "Enterprise value" | tr -d ', ' | cut -d: -f2; }
          cli=$(run_all | ev | sort -u)
          api=$(FIN_API_URL=http://127.0.0.1:8000 run_all | ev | sort -u)
          shell_cli=$(sh examples/shell/valuation.sh | python -c "import json,sys;print(round(json.load(sys.stdin)['analysis']['DCF Valuation']['ev_gordon']))")
          shell_api=$(FIN_API_URL=http://127.0.0.1:8000 sh examples/shell/valuation.sh | python -c "import json,sys;print(round(json.load(sys.stdin)['dcf']['ev_gordon']))")
          echo "cli=$cli api=$api shell_cli=$shell_cli shell_api=$shell_api"
          test "$(printf '%s\n' $cli $api $shell_cli $shell_api | sort -u | wc -l)" -eq 1

  container:
    # Same OCI image from two different runtimes.
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        engine: [docker, podman]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: ${{ matrix.engine }} build -t financial-model .
      - name: Smoke test
        run: |
          ${{ matrix.engine }} run -d --name fm -p 8000:8000 -e FIN_API_KEY=ci financial-model
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/models)" = 401
          curl -fsS -H "X-API-Key: ci" http://127.0.0.1:8000/models
          ${{ matrix.engine }} rm -f fm
