name: "SaaS LBO Model"
model_type: "lbo"
periods:
  start_year: 2024
  years: 5
  type: "annual"

assumptions:
  metadata:
    industry: "SaaS"
    currency: "USD"
    deal_date: "2024-01-01"

  drivers:
    # Operating (same as three-statement)
    revenue:
      value: 10000000
      description: "Starting revenue"
      unit: "$"
    revenue_growth:
      value: [0.30, 0.25, 0.20, 0.15, 0.10]
      description: "YoY revenue growth (conservative for LBO)"
      unit: "%"
    cogs_pct:
      value: 0.22
      description: "COGS % of revenue"
      unit: "%"
    rd_pct:
      value: 0.18
      description: "R&D % of revenue"
      unit: "%"
    sm_pct:
      value: 0.30
      description: "S&M % of revenue (optimized post-buyout)"
      unit: "%"
    gna_pct:
      value: 0.08
      description: "G&A % of revenue"
      unit: "%"
    sbc:
      value: [300000, 300000, 300000, 300000, 300000]
      description: "Reduced SBC post-buyout"
      unit: "$"
    tax_rate:
      value: 0.21
      description: "Tax rate"
      unit: "%"
    ar_days:
      value: 45
      unit: "days"
    ap_days:
      value: 60
      unit: "days"
    deferred_rev_pct:
      value: 0.30
      unit: "%"
    ppe_gross:
      value: 1000000
      description: "Opening gross PP&E"
      unit: "$"
    capex:
      value: -400000
      description: "Reduced CapEx post-buyout"
      unit: "$"
    depreciation_rate:
      value: 0.20
      unit: "%"
    beginning_cash:
      value: 500000
      description: "Cash left on the balance sheet at close"
      unit: "$"
    long_term_debt:
      value: 1000000
      description: "Target's existing debt (refinanced at close)"
      unit: "$"
    min_cash:
      value: 250000
      description: "Minimum operating cash (excess above this is swept)"
      unit: "$"

    # LBO transaction assumptions
    entry_multiple:
      value: 12.0
      description: "Entry EV/EBITDA multiple"
      unit: "x"
    entry_ebitda:
      value: 0
      description: "LTM EBITDA at entry (0 = use the model's first-year EBITDA)"
      unit: "$"
    equity_contribution:
      value: 0.40
      description: "Sponsor equity as % of total uses"
      unit: "%"
    fees_pct:
      value: 0.02
      description: "Transaction fees as % of EV"
      unit: "%"

    # Debt structure (tranche percentages are normalised across the funded tranches)
    tla_pct:
      value: 0.30
      description: "Term Loan A % of funded debt"
      unit: "%"
    tla_rate:
      value: 0.07
      description: "TLA interest rate (SOFR + 3.5%)"
      unit: "%"
    tla_amort:
      value: 0.05
      description: "TLA annual amortization (% of original principal)"
      unit: "%"
    tlb_pct:
      value: 0.40
      description: "Term Loan B % of funded debt"
      unit: "%"
    tlb_rate:
      value: 0.085
      description: "TLB interest rate (SOFR + 5%)"
      unit: "%"
    tlb_amort:
      value: 0.01
      description: "TLB annual amortization (1% - effectively bullet)"
      unit: "%"
    revolver_pct:
      value: 0.15
      description: "Revolver commitment % of funded debt (undrawn at close)"
      unit: "%"
    revolver_rate:
      value: 0.075
      description: "Revolver rate"
      unit: "%"
    sub_pct:
      value: 0.20
      description: "Subordinated notes % of funded debt (bullet)"
      unit: "%"
    sub_rate:
      value: 0.11
      description: "Sub debt rate"
      unit: "%"
    mezz_pct:
      value: 0.10
      description: "Mezzanine % of funded debt (bullet)"
      unit: "%"
    mezz_rate:
      value: 0.13
      description: "Mezz rate"
      unit: "%"
    sweep_pct:
      value: 0.75
      description: "% of excess cash swept to Term Loan A, then B"
      unit: "%"

    # Exit
    exit_multiple:
      value: 13.0
      description: "Exit EV/EBITDA multiple (expansion)"
      unit: "x"
    hold_years:
      value: 5
      description: "Investment hold period"
      unit: "years"

  scenarios:
    base: {}
    aggressive:
      entry_multiple: 10.0
      exit_multiple: 15.0
      sweep_pct: 1.0
      revenue_growth: [0.35, 0.30, 0.25, 0.20, 0.15]
    conservative:
      entry_multiple: 14.0
      exit_multiple: 11.0
      sweep_pct: 0.50
      revenue_growth: [0.20, 0.15, 0.10, 0.08, 0.05]
      equity_contribution: 0.50

statements: []
