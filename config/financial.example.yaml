# Runtime settings for `financial-model serve` / the API container.
# Copy to ./financial.yaml (auto-loaded) or point FIN_CONFIG_PATH at it.
# Every key can also be set as an env var: FIN_<SECTION>_<KEY>, e.g. FIN_API_PORT=9000.
# Model assumptions do NOT go here - they live in the model YAMLs (three_statement_saas.yaml, ...).

api:
  host: 127.0.0.1          # 0.0.0.0 to listen on all interfaces (the Docker image does this)
  port: 8000
  workers: 1
  cors_origins: []         # e.g. ["https://dashboard.example.com"]; empty = same-origin only
  api_key: ""              # set to require `X-API-Key: <value>` on every route except /health and /docs
  max_request_mb: 10       # larger request bodies get HTTP 413

data:
  rate_limit:              # applies to yfinance fetches (CLI `fetch` and API /fetch)
    max_requests_per_minute: 30
    max_requests_per_hour: 500
    circuit_breaker_threshold: 5   # consecutive failures before fetches are refused...
    circuit_breaker_timeout: 60.0  # ...for this many seconds

logging:
  level: INFO

# Business-model templates (paas, b2b-saas, b2c-subscription): extra directories
# searched first for `<model_type>.yaml`, to ship your own default drivers and scenarios.
models:
  template_paths: []

# Commercial multi-tenant mode: hosted PaaS API, B2B organisations, B2C self-serve.
# Off by default. Every default lives in financial_model/platform/settings.yaml (runtime)
# and financial_model/platform/catalog.yaml (plans, prices, pay-to-use, roles, endpoints);
# anything below overrides them. See docs/commercial.md.
platform:
  enabled: false
  database: sqlite:///financial_platform.db   # or sqlite:////data/platform.db in a container
  secret_key: ""            # REQUIRED in production (signs login tokens): FIN_PLATFORM_SECRET_KEY
  # catalog: [builtin, pricing.yaml]          # layer or replace catalogue files
  # currency: EUR
  # plans:                                     # deep-merged over the catalogue; null removes
  #   pro: {price: {monthly: 29}, metering: {runs: {included: 10000}}}
  #   payg: {metering: {runs: {tiers: null, unit_price: 0.03}}}
  billing:
    provider: manual        # manual | stripe | a plugin provider
    stripe:
      secret_key: ""        # FIN_PLATFORM_BILLING_STRIPE_SECRET_KEY
      webhook_secret: ""    # FIN_PLATFORM_BILLING_STRIPE_WEBHOOK_SECRET; endpoint: POST /v1/billing/webhook
      prices: {}            # plan -> Stripe price id, e.g. {pro: price_123, team: price_456}
      meters: {}            # metric -> Stripe meter event name for pay-to-use, e.g. {runs: model_runs}
