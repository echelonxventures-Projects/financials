# Defaults of the `lbo` model: only what differs from `three-statement`.
model_type: lbo
extends: three-statement
name: LBO Model
description: Three-statement model plus sources & uses, multi-tranche debt schedule and returns
drivers:
  entry_multiple:
    value: 10.0
    description: Entry EV/EBITDA
    unit: x
  entry_ebitda:
    value: 0.0
    description: LTM EBITDA at entry (0 = model's first-year EBITDA)
    unit: $
  equity_contribution:
    value: 0.4
    description: Sponsor equity % of total uses
    unit: '%'
  fees_pct:
    value: 0.02
    description: Transaction fees % of EV
    unit: '%'
  tla_pct:
    value: 0.3
    description: Term Loan A % of funded debt
    unit: '%'
  tla_rate:
    value: 0.065
    description: TLA interest rate
    unit: '%'
  tla_amort:
    value: 0.05
    description: TLA annual amortisation % of original principal
    unit: '%'
  tlb_pct:
    value: 0.2
    description: Term Loan B % of funded debt
    unit: '%'
  tlb_rate:
    value: 0.085
    description: TLB interest rate
    unit: '%'
  tlb_amort:
    value: 0.01
    description: TLB annual amortisation % of original principal
    unit: '%'
  revolver_pct:
    value: 0.1
    description: Revolver commitment % of funded debt (undrawn at close)
    unit: '%'
  revolver_rate:
    value: 0.07
    description: Revolver rate
    unit: '%'
  sub_pct:
    value: 0.1
    description: Subordinated debt % of funded debt
    unit: '%'
  sub_rate:
    value: 0.11
    description: Sub debt rate
    unit: '%'
  mezz_pct:
    value: 0.05
    description: Mezzanine % of funded debt
    unit: '%'
  mezz_rate:
    value: 0.13
    description: Mezz rate
    unit: '%'
  sweep_pct:
    value: 0.5
    description: Cash sweep % of excess cash
    unit: '%'
  exit_multiple:
    value: 11.0
    description: Exit EV/EBITDA
    unit: x
  hold_years:
    value: 5
    description: Hold period
    unit: years
# Charts added to the inherited three-statement charts. `group: tranches` is every tranche of the model.
charts:
  lbo_debt:
    group: lbo
    kind: bar
    source: debt_schedule
    title: Debt Paydown by Tranche
    yaxis: $
    barmode: stack
    series: [{group: tranches}, {column: Revolver}]
    overlays:
    - {column: Cash, color: overlay_line}
  lbo_sources:
    group: lbo
    kind: pie
    source: sources_uses
    table: sources
    labels: Source
    values: Amount
    positive_only: true
    hole: 0.5
    title: Sources of Funds
  lbo_returns:
    group: lbo
    kind: waterfall
    source: returns
    title: "Sponsor Returns — {moic:.2f}x MOIC, {irr:.1%} IRR"
    yaxis: $
    steps:
    - {label: Equity Invested, value: equity_invested, measure: absolute}
    - {label: Value Created, value: equity_value_at_exit - equity_invested}
    - {label: Equity at Exit, value: equity_value_at_exit, measure: total}
starter_scenarios: {}
# Debt tranches, in seniority order. Each needs `<key>_pct`, `<key>_rate` (and `<key>_amort` when
# amortizing) drivers. Add, remove or rename tranches here; the schedule, interest lines, balance
# sheet, sources & uses and charts follow.
tranches:
- {name: Term Loan A, key: tla, amortizing: true, interest_line: TLA Interest}
- {name: Term Loan B, key: tlb, amortizing: true, interest_line: TLB Interest}
- {name: Subordinated Debt, key: sub, amortizing: false, interest_line: Sub Interest}
- {name: Mezzanine Debt, key: mezz, amortizing: false, interest_line: Mezz Interest}
# Where the debt schedule appears in the statements. `{name}` is the tranche name; tranche
# interest lines share the order band [interest_order, interest_order + 1); `add_to` lists the
# totals a line is added to. The amounts come from the debt-schedule engine.
layout:
  tranche_balance:
    statement: balance_sheet
    order: 165
    order_step: 1
    description: "{name} balance (opening - amortisation - sweep)"
    add_to: [Total Liabilities]
  tranche_interest:
    order: 62
    description: "{name} interest on opening balance"
  revolver_interest: {name: Revolver Interest, order: 66, description: Revolver interest on opening balance}
  total_interest: {name: Interest Expense, order: 67, description: Total interest expense}
  mandatory_amortization:
    name: Mandatory Debt Amortization
    order: 102
    description: Scheduled Term Loan A/B amortisation
    add_to: [Financing Cash Flow]
  cash_sweep:
    name: Cash Sweep Repayment
    order: 103
    description: Optional prepayment from excess cash
    add_to: [Financing Cash Flow]
