# Defaults of the `ma` (merger) model: deal terms, which model types may be the acquirer or
# target, the share-price fallback for a loss-making acquirer, and the `init` starter deal.
model_type: ma
aliases: [m&a, m-a, merger]
name: M&A Model
description: Accretion / dilution, synergy phase-in and contribution analysis of two models
side_model_types:
- three-statement
- dcf
- lbo
deal:
  offer_price_per_share: 0.0
  target_shares: 1000000
  cash_consideration_pct: 0.5
  stock_consideration_pct: 0.5
  synergies: 0.0
  synergy_phase_in:
  - 0.3
  - 0.6
  - 0.8
  - 1.0
  - 1.0
  financing_rate: 0.06
  tax_rate: 0.21
  acquirer_shares: 10000000
  acquirer_share_price: null
  acquirer_pe: 20.0
loss_making_acquirer:
  revenue_multiple: 5.0
  min_share_price: 1.0
