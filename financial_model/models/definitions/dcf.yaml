# Defaults of the `dcf` model: only what differs from `three-statement`.
model_type: dcf
extends: three-statement
name: DCF Model
description: Three-statement model plus WACC, terminal value and sensitivity valuation
drivers:
  tax_rate:
    value: 0.21
    description: Tax rate
    unit: '%'
  risk_free_rate:
    value: 0.045
    description: Risk-free rate
    unit: '%'
  equity_risk_premium:
    value: 0.055
    description: Equity risk premium
    unit: '%'
  beta:
    value: 1.2
    description: Levered beta
    unit: x
  cost_of_debt:
    value: 0.06
    description: Pre-tax cost of debt
    unit: '%'
  target_debt_ratio:
    value: 0.2
    description: Target D/(D+E)
    unit: '%'
  terminal_growth:
    value: 0.025
    description: Terminal growth rate
    unit: '%'
  exit_multiple:
    value: 12.0
    description: Exit EV/EBITDA multiple
    unit: x
starter_scenarios: {}
# Default WACC x terminal-growth grid of the sensitivity table.
sensitivity:
  wacc_range: [0.07, 0.13]
  growth_range: [0.01, 0.04]
  steps: 5
# Starter config written by `financial-model init --type dcf [--industry <variant>]`.
# period_paths get start_year/years; truncate_to_years lists are cut to the year count;
# cap_at_years values are capped at it. Unknown industries use fallback_variant.
