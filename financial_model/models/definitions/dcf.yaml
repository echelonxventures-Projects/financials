# Defaults of the `dcf` model: only what differs from `three-statement`.
model_type: dcf
extends: three-statement
name: DCF Model
description: Three-statement model plus WACC, terminal value and sensitivity valuation
drivers:
  tax_rate:
    value: 0.21
    description: Tax rate
    unit: '%'
  risk_free_rate:
    value: 0.045
    description: Risk-free rate
    unit: '%'
  equity_risk_premium:
    value: 0.055
    description: Equity risk premium
    unit: '%'
  beta:
    value: 1.2
    description: Levered beta
    unit: x
  cost_of_debt:
    value: 0.06
    description: Pre-tax cost of debt
    unit: '%'
  target_debt_ratio:
    value: 0.2
    description: Target D/(D+E)
    unit: '%'
  terminal_growth:
    value: 0.025
    description: Terminal growth rate
    unit: '%'
  exit_multiple:
    value: 12.0
    description: Exit EV/EBITDA multiple
    unit: x
# Names of the DCF analysis tables (exports, API, CLI) and the index of the free-cash-flow table.
tables: {valuation: DCF Valuation, free_cash_flow: Free Cash Flow, sensitivity: Sensitivity, period_index: Period}

# `financial-model dcf` console output (see ma.yaml for the block fields); text values are the DCF results.
console:
- text: "WACC: {wacc:.2%}"
- text: "Cost of Equity: {cost_of_equity:.2%}"
- text: "Terminal EBITDA: ${terminal_ebitda:,.0f}"
- text: "EV (Gordon): ${ev_gordon:,.0f}"
- text: "EV (Multiple): ${ev_multiple:,.0f}"
- text: "Net Debt: ${net_debt:,.0f}"
- text: "Equity Value (Gordon): ${equity_gordon:,.0f}"
- text: "Equity Value (Multiple): ${equity_multiple:,.0f}"
- text: "Price/Share (Gordon): ${price_gordon:,.2f}"
- text: "Price/Share (Multiple): ${price_multiple:,.2f}"
- {title: "\nFree cash flow:", table: fcf, transpose: true, float_format: ",.0f"}
- {title: "\nSensitivity (Equity Value, Gordon growth):", table: sensitivity, float_format: ",.0f"}

# Charts added to the inherited three-statement charts (see three-statement.yaml).
charts:
  dcf_fcf:
    group: dcf
    kind: bar
    source: dcf
    x: periods
    title: Unlevered Free Cash Flow
    yaxis: $
    series:
    - {name: Free Cash Flow, key: fcf}
    - {name: PV of FCF, key: pv_fcf}
  dcf_bridge:
    group: dcf
    kind: waterfall
    source: dcf
    title: EV to Equity Bridge (Gordon growth)
    yaxis: $
    steps:                       # value: an expression over the DCF results
    - {label: PV of FCF, value: sum(pv_fcf)}
    - {label: PV of Terminal Value, value: pv_terminal_gordon}
    - {label: Enterprise Value, value: ev_gordon, measure: total}
    - {label: "Less: Net Debt", value: -net_debt}
    - {label: Equity Value, value: equity_gordon, measure: total}
  dcf_sensitivity:
    group: dcf
    kind: heatmap
    source: dcf_sensitivity
    title: Equity Value Sensitivity
    xaxis: WACC
    yaxis: Terminal growth
    colorscale: heatmap_scale
    colorbar: Equity
    hovertemplate: "WACC %{x}<br>Growth %{y}<br>Equity %{z:,.0f}<extra></extra>"
    hovermode: closest
starter_scenarios: {}
# Default WACC x terminal-growth grid of the sensitivity table.
sensitivity:
  wacc_range: [0.07, 0.13]
  growth_range: [0.01, 0.04]
  steps: 5
