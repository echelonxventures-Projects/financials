# Defaults of the `budget` model. `departments` lists the departments built by default;
# `department_defaults` seeds the drivers of any department added without its own values.
model_type: budget
name: Budget Model
description: 'Driver-based budget: ARR roll-forward and headcount x cost by department'
departments:
- Engineering
- Sales
- Marketing
- G&A
- R&D
department_defaults:
  headcount:
    value: 10
    unit: FTE
    label: headcount
  cost_per_head:
    value: 150000
    unit: $
    label: fully loaded cost
# Driver prefix of a department whose name is not a plain word (others: lower-case, '_' for gaps).
department_keys: {"g&a": gna, "r&d": rd, "s&m": sm}
# Lines built for every department. Placeholders: {dept} (name) and {key} (driver prefix);
# `driver: <suffix>` uses the department's `<key>_<suffix>` driver; `offset` adds to the
# department's order (order_start + position x order_step). Each department's `rollup_line`
# becomes a child of the `rollup` total.
department_template:
  order_start: 20
  order_step: 10
  rollup: Total Operating Expense
  rollup_line: "{dept} Expense"
  lines:
    "{dept} Headcount": {line_type: input, offset: 0, unit: FTE, format: "{:,.1f}", driver: headcount}
    "{dept} Cost per Head": {line_type: input, offset: 1, driver: cost_per_head}
    "{dept} Expense":
      formula: "-line('{dept} Headcount') * line('{dept} Cost per Head')"
      offset: 2
      description: "{dept} total expense (negative)"
opening_balances:
  Cash & Cash Equivalents: beginning_cash
opening_retained_earnings: "opening('Cash & Cash Equivalents')"
# Base layout (departments are added from department_template). Same fields as three-statement.
structure:
  income_statement:
    Starting ARR: {line_type: input, order: 1, driver: starting_arr}
    New ARR: {line_type: input, order: 2, driver: new_arr}
    Expansion ARR: {line_type: input, order: 3, driver: expansion_arr}
    Churned ARR: {line_type: input, order: 4, driver: churned_arr}
    Ending ARR: {calculation_rule: sum_children, order: 5, children: [Starting ARR, New ARR, Expansion ARR, Churned ARR], is_total: true}
    Revenue: {formula: "(line('Starting ARR') + line('Ending ARR')) / 2", order: 10, is_total: true, description: Recognized revenue (average ARR)}
    Total Operating Expense: {line_type: aggregate, order: 100, is_total: true, description: Total OpEx (negative)}
    Operating Income: {calculation_rule: sum_children, order: 110, children: [Revenue, Total Operating Expense], is_total: true}
    Net Income: {formula: "line('Operating Income') * (1 - tax_rate)", order: 120, driver: tax_rate, is_total: true, description: Operating income x (1 - tax rate)}
  balance_sheet:
    Cash & Cash Equivalents: {line_type: plug, order: 1}
    Total Assets: {line_type: aggregate, order: 100, children: [Cash & Cash Equivalents], is_total: true}
    Total Liabilities: {line_type: aggregate, order: 200, is_total: true}
    Retained Earnings: {line_type: plug, order: 250}
    Total Equity: {line_type: aggregate, order: 300, children: [Retained Earnings], is_total: true}
  cash_flow:
    Net Income: {line_type: link, order: 1, calculation_params: {source_line: Net Income, source_statement: income_statement}}
    Operating Cash Flow: {line_type: aggregate, order: 10, children: [Net Income], is_total: true}
    Investing Cash Flow: {line_type: aggregate, order: 20, is_total: true}
    Financing Cash Flow: {line_type: aggregate, order: 30, is_total: true}
    Net Change in Cash: {line_type: plug, order: 90}
    Beginning Cash Balance: {line_type: input, order: 91, driver: beginning_cash}
    Ending Cash Balance: {line_type: aggregate, order: 92, children: [Beginning Cash Balance, Net Change in Cash], is_total: true}
drivers:
  tax_rate:
    value: 0.21
    description: Tax rate
    unit: '%'
  starting_arr:
    value: 10000000
    description: Beginning ARR
    unit: $
  new_arr:
    value: 3000000
    description: New ARR booked
    unit: $
  expansion_arr:
    value: 1500000
    description: Expansion ARR
    unit: $
  churned_arr:
    value: -500000
    description: Churned ARR (negative)
    unit: $
  engineering_headcount:
    value: 10
    description: Engineering headcount
    unit: FTE
  engineering_cost_per_head:
    value: 150000
    description: Engineering fully loaded cost
    unit: $
  sales_headcount:
    value: 10
    description: Sales headcount
    unit: FTE
  sales_cost_per_head:
    value: 150000
    description: Sales fully loaded cost
    unit: $
  marketing_headcount:
    value: 10
    description: Marketing headcount
    unit: FTE
  marketing_cost_per_head:
    value: 150000
    description: Marketing fully loaded cost
    unit: $
  gna_headcount:
    value: 10
    description: G&A headcount
    unit: FTE
  gna_cost_per_head:
    value: 150000
    description: G&A fully loaded cost
    unit: $
  rd_headcount:
    value: 10
    description: R&D headcount
    unit: FTE
  rd_cost_per_head:
    value: 150000
    description: R&D fully loaded cost
    unit: $
  beginning_cash:
    value: 0
    description: Beginning cash
    unit: $
# Charts of the budget (see three-statement.yaml for the fields). `match` picks every line by name.
charts:
  arr:
    kind: bar
    source: income_statement
    title: ARR Movements
    yaxis: $
    barmode: relative
    series: [New ARR, Expansion ARR, Churned ARR]
    overlays:
    - line: Ending ARR
      axis: y2
      layout: {yaxis2: {overlaying: y, side: right, tickformat: ",.0f", showgrid: false}}
  opex:
    kind: bar
    source: income_statement
    title: Operating Expense by Department
    yaxis: $
    barmode: stack
    series: [{match: {suffix: " Expense", exclude_prefix: Total}, abs: true}]
  headcount:
    kind: bar
    source: income_statement
    title: Headcount by Department
    yaxis: FTE
    barmode: stack
    series: [{match: {suffix: " Headcount"}, rename: {" Headcount": ""}}]
  revenue:
    kind: bar
    source: income_statement
    title: Revenue vs Operating Income
    yaxis: $
    series: [Revenue]
    overlays: [Operating Income]
starter_scenarios: {}
