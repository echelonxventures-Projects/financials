# Defaults of the `b2b-saas` model (extends business -> three-statement): its own drivers, the three-statement
# defaults it changes, starter drivers and scenarios for `financial-model init`, and the rows and
# labels of its Unit Economics table. Override any of it, or ship your own copy via
# `models.definition_paths`.
model_type: b2b-saas
aliases: [b2b, saas-b2b]
extends: business
name: B2B SaaS (sales-led) Model
description: Sales-led B2B SaaS - reps and quota book new ARR; existing ARR expands and churns
drivers:
  starting_customers:
    value: 200
    description: Customers at the start of the first period
    unit: '#'
  starting_acv:
    value: 50000
    description: Average ACV of the starting customer base
    unit: $/yr
  sales_reps:
    value:
    - 10
    - 14
    - 18
    - 22
    - 26
    description: Ramped quota-carrying reps (average in period)
    unit: '#'
  quota_per_rep:
    value: 700000
    description: Annual new-ARR quota per ramped rep
    unit: $/yr
  quota_attainment:
    value: 0.7
    description: Average quota attainment
    unit: '%'
  new_acv:
    value: 55000
    description: ACV of newly won customers
    unit: $/yr
  rep_cost:
    value: 250000
    description: Fully loaded annual cost per rep (OTE, SE and SDR support)
    unit: $/yr
  marketing_spend:
    value: 1500000
    description: Demand-generation spend per period
    unit: $
  annual_logo_churn:
    value: 0.1
    description: Annual logo (and ARR) churn
    unit: '%'
  annual_expansion:
    value: 0.18
    description: Annual expansion on existing ARR (upsell, seats, price)
    unit: '%'
  services_pct:
    value: 0.05
    description: Professional services revenue as % of subscription revenue
    unit: '%'
  services_cogs_pct:
    value: 0.8
    description: Cost of services as % of services revenue
    unit: '%'
  cogs_pct:
    value: 0.2
    description: COGS as % of revenue
    unit: '%'
  sm_pct:
    value: 0.05
    description: S&M as % of revenue
    unit: '%'
  deferred_rev_pct:
    value: 0.4
    description: Deferred revenue as % of revenue
    unit: '%'
  ar_days:
    value: 60
    description: Accounts receivable days
    unit: days
kpi_rows:
- key: end_customers
  label: Customers (end of period)
- key: new_customers
  label: New Logos
- key: churned_customers
  label: Churned Logos
- key: begin_arr
  label: Beginning ARR
- key: new_arr
  label: New ARR
- key: expansion_arr
  label: Expansion ARR
- key: churned_arr
  label: Churned ARR
- key: end_arr
  label: Ending ARR
- key: net_revenue_retention
  label: Net Revenue Retention (annualised)
- key: gross_revenue_retention
  label: Gross Revenue Retention (annualised)
- key: subscription_revenue
  label: Subscription Revenue
- key: services_revenue
  label: Services Revenue
- key: magic_number
  label: Magic Number (net new ARR / S&M)
starter:
  fallback_variant: default
  period_paths:
  - periods
  truncate_to_years:
  - assumptions.drivers.*.value
  variants:
    default:
      name: B2B SaaS (sales-led) Model
      model_type: b2b-saas
      periods:
        type: annual
      assumptions:
        metadata:
