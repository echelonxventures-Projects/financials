# Defaults of the `paas` model type: drivers, three-statement defaults it changes,
# extra drivers written by `financial-model init`, and the shipped scenarios.
# Override any of it per model in the model YAML, or ship your own template: put a
# `paas.yaml` in a directory listed in the settings key `models.template_paths`.
name: PaaS (usage-based platform) Model
model_type: paas
description: Usage-based platform - sign-ups convert to paying accounts whose usage grows
drivers:
  starting_accounts:
    value: 1000
    description: Paying accounts at the start
    unit: '#'
  new_signups:
    value: 20000
    description: Developer sign-ups per period
    unit: '#'
  signup_conversion:
    value: 0.03
    description: Share of sign-ups that become paying accounts
    unit: '%'
  annual_account_churn:
    value: 0.15
    description: Annual churn of paying accounts
    unit: '%'
  usage_per_account:
    value: 5000
    description: Starting monthly usage per paying account (units)
    unit: units/mo
  usage_growth:
    value: 0.3
    description: Annual growth in usage per surviving account
    unit: '%'
  free_units:
    value: 500
    description: Monthly free allowance per paying account (units, unbilled)
    unit: units/mo
  price_per_unit:
    value: 0.1
    description: List price per billable unit
    unit: $
  discount_pct:
    value: 0.05
    description: Average committed-use / volume discount
    unit: '%'
  platform_fee:
    value: 100
    description: Monthly platform (seat / plan) fee per paying account
    unit: $/mo
  free_accounts:
    value: 10000
    description: Active free-tier accounts (average in period)
    unit: '#'
  free_account_usage:
    value: 300
    description: Monthly usage per free-tier account (units)
    unit: units/mo
  infra_cost_per_unit:
    value: 0.03
    description: Infrastructure cost per unit served
    unit: $
  marketing_spend:
    value: 1000000
    description: Developer marketing / DevRel spend per period
    unit: $
default_overrides:
  cogs_pct:
    value: 0.05
    description: COGS as % of revenue
    unit: '%'
  sm_pct:
    value: 0.1
    description: S&M as % of revenue
    unit: '%'
  ar_days:
    value: 30
    description: Accounts receivable days
    unit: days
  deferred_rev_pct:
    value: 0.05
    description: Deferred revenue as % of revenue
    unit: '%'
template_drivers:
  rd_pct:
    value: 0.18
    description: R&D as % of revenue
    unit: '%'
  gna_pct:
    value: 0.1
    description: G&A as % of revenue
    unit: '%'
  beginning_cash:
    value: 5000000
    description: Opening cash
    unit: $
  apic:
    value: 10000000
    description: Opening paid-in capital
    unit: $
scenarios:
  base: {}
  upside:
    signup_conversion: 0.04
    usage_growth: 0.4
    annual_account_churn: 0.1
  downside:
    signup_conversion: 0.02
    usage_growth: 0.15
    infra_cost_per_unit: 0.04
metadata:
  business_model: paas
  currency: USD
periods:
  type: annual
