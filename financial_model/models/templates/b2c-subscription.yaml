# Defaults of the `b2c-subscription` model type: drivers, three-statement defaults it changes,
# extra drivers written by `financial-model init`, and the shipped scenarios.
# Override any of it per model in the model YAML, or ship your own template: put a
# `b2c-subscription.yaml` in a directory listed in the settings key `models.template_paths`.
name: B2C Subscription Model
model_type: b2c-subscription
description: Consumer subscription app - paid and organic acquisition, monthly churn, ARPU
drivers:
  starting_subscribers:
    value: 100000
    description: Paying subscribers at the start
    unit: '#'
  marketing_spend:
    value: 4000000
    description: Paid acquisition spend per period
    unit: $
  paid_cac:
    value: 40
    description: Cost to acquire one paying subscriber through paid channels
    unit: $
  organic_ratio:
    value: 0.6
    description: Organic / referral subscribers per paid subscriber
    unit: x
  monthly_churn:
    value: 0.05
    description: Monthly subscriber churn
    unit: '%'
  monthly_arpu:
    value: 9.99
    description: Average revenue per subscriber per month (net of discounts)
    unit: $/mo
  payment_fee_pct:
    value: 0.15
    description: Payment processor / app-store fees as % of revenue
    unit: '%'
  new_subscriber_churn_exposure:
    value: 0.5
    description: Share of a period that subscribers added in it are exposed to churn
    unit: x
default_overrides:
  cogs_pct:
    value: 0.1
    description: COGS as % of revenue
    unit: '%'
  sm_pct:
    value: 0.05
    description: S&M as % of revenue
    unit: '%'
  ar_days:
    value: 5
    description: Accounts receivable days
    unit: days
  deferred_rev_pct:
    value: 0.1
    description: Deferred revenue as % of revenue
    unit: '%'
  inventory_days:
    value: 0
    description: Inventory days
    unit: days
template_drivers:
  rd_pct:
    value: 0.18
    description: R&D as % of revenue
    unit: '%'
  gna_pct:
    value: 0.1
    description: G&A as % of revenue
    unit: '%'
  beginning_cash:
    value: 5000000
    description: Opening cash
    unit: $
  apic:
    value: 10000000
    description: Opening paid-in capital
    unit: $
scenarios:
  base: {}
  upside:
    paid_cac: 32
    monthly_churn: 0.04
    organic_ratio: 0.8
  downside:
    paid_cac: 55
    monthly_churn: 0.065
    organic_ratio: 0.4
metadata:
  business_model: b2c-subscription
  currency: USD
periods:
  type: annual
