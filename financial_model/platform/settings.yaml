# Built-in runtime settings of the commercial platform (the `platform:` section of the
# settings file). This file contains ONLY bootstrap/runtime settings.
# ALL business configuration (plans, prices, legal docs, email, SSO, billing) is managed
# via the Admin Portal API and stored in versioned YAML files in the data directories.

enabled: true
# sqlite:///relative.db, sqlite:////absolute.db, sqlite:///:memory:, or a plugin scheme.
database: sqlite:///financial_platform.db
# Catalogue files merged in order; `builtin` = the shipped catalog.yaml.
catalog: [builtin]

# ------------------------------------------------------------------
# Secret key management (auto-generated if not provided in production)
# ------------------------------------------------------------------
# Signs login tokens. Required to serve the platform: tokens must survive restarts and
# every replica must agree. Generate one with:
#   python3 -c "import secrets; print(secrets.token_urlsafe(32))"
# If empty and require_secret_key is true, serve will auto-generate one and save it
# to the settings file (for file-based settings) or require env var.
secret_key: ""
# `serve` refuses to start without a secret_key of at least this many characters.
# Set require_secret_key: false only for local experiments (a random per-process secret
# is used, so every restart signs everyone out).
require_secret_key: true
secret_key_min_length: 32
# Auto-generate and persist secret_key if missing (writes to FIN_CONFIG_PATH or ./financial.yaml).
# Only works when settings file is writable. In containers, prefer setting FIN_PLATFORM_SECRET_KEY.
auto_generate_secret_key: true
token_ttl_hours: 24
password_iterations: 600000
password_min_length: 8
api_key_prefix: fm
allow_signup: true

# ------------------------------------------------------------------
# Login throttling (runtime only - not business config)
# ------------------------------------------------------------------
login_throttle:
  window_seconds: 900
  max_failures_per_email: 5
  max_failures_per_address: 50

# ------------------------------------------------------------------
# Feature flags (enable/disable subsystems)
# Detailed config for each is managed via Admin Portal API
# ------------------------------------------------------------------
features:
  legal: true
  email: true
  sso: false
  billing: true

# ------------------------------------------------------------------
# Storage paths for versioned configuration files (managed by Admin API)
# ------------------------------------------------------------------
storage:
  legal_path: "./legal_documents"
  email_templates_path: "./email_templates"
  sso_providers_path: "./sso_providers"
  catalog_path: "./catalog_override.yaml"

# ------------------------------------------------------------------
# Billing provider selection only (detailed config via Admin API)
# ------------------------------------------------------------------
billing:
  provider: manual

# ------------------------------------------------------------------
# API endpoints (catalogue-driven, these are the built-in routes)
# ------------------------------------------------------------------
endpoints:
  # Legal acceptance
  "POST /v1/legal/accept": {permission: view, features: []}
  "GET /v1/legal/status": {permission: view, features: []}
  "GET /v1/legal/document/{key}": {permission: view, features: []}
  # SSO
  "GET /v1/sso/providers": {public: true}
  "POST /v1/sso/login": {public: true}
  "GET /v1/sso/callback": {public: true}
  "POST /v1/sso/logout": {permission: view}
  # Email (admin only)
  "POST /v1/admin/email/send": {permission: manage_billing, features: []}
  "POST /v1/admin/email/test": {permission: manage_billing, features: []}