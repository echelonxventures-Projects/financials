[project]
name = "financial-model"
dynamic = ["version"]
description = "Extensible financial modeling toolkit: three-statement, DCF, LBO, M&A, budgeting"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
# Core: engine, models, YAML configs, Excel/CSV/JSON export, CLI, the `file` data provider.
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    # pydantic needs this to read `X | None` annotations on Python 3.9 (stdlib does it from 3.10)
    "eval_type_backport>=0.2; python_version < '3.10'",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]      # REST API / `financial-model serve`
charts = ["plotly>=5.20"]                       # `financial-model chart`, POST /charts
yfinance = ["yfinance>=0.2.1"]                    # the `yfinance` data provider
all = ["financial-model[api,charts,yfinance]"]
dev = [
    "financial-model[all]",
    "httpx>=0.27",   # FastAPI TestClient
    "jsonschema>=4.18",  # tests check configs against schemas/config.schema.json
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.98",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.6",
    "types-PyYAML",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
]

[project.scripts]
financial-model = "financial_model.cli.main:app"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "financial_model.__version__" }

[tool.setuptools.packages.find]
include = ["financial_model*"]

[tool.setuptools.package-data]
# Data files that hold defaults instead of code (catalogue, settings, model templates).
financial_model = ["platform/*.yaml", "models/definitions/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:fastapi.*",
]

[tool.coverage.run]
source = ["financial_model"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "ARG", "PTH", "FA"]
ignore = [
    "E501",   # line length is handled by the formatter; long lambdas/configs allowed
    "B008",   # typer.Option() in argument defaults is the documented pattern
    "N806",   # upper-case locals (statement constants IS/BS/CF)
    "SIM108", # ternaries are not always clearer
    "ARG005", # formula lambdas share the (df, idx, drivers) signature
]

[tool.ruff.lint.isort]
# Keeps `X | None` / `list[int]` annotations lazy, so they work on every supported Python.
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
# Typer reads command signatures with typing.get_type_hints at runtime; on Python 3.9 that
# cannot evaluate `X | None`, so CLI parameters use Optional[X].
"financial_model/cli/main.py" = ["UP045", "UP007"]
"financial_model/cli/platform_cmds.py" = ["UP045", "UP007"]
"tests/*" = ["ARG", "B", "SIM", "PTH", "N", "E741", "E712", "F401", "F841"]
"financial_model/utils/*" = ["N818", "SIM"]
"financial_model/platform/*" = ["N818"]  # HTTP-style error names (NotFound, Forbidden...)

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
plugins = ["pydantic.mypy"]
# No python_version: mypy checks against the interpreter it runs on (any supported one).
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_configs = true
warn_return_any = false
check_untyped_defs = true
disallow_untyped_defs = false
strict_optional = true
exclude = ["tests/", "build/", "dist/"]
