  \        <hr style=\"border: none; border-top: 1px solid #e2e8f0; margin: 20px 0;\"\
  >\n        <p style=\"color: #64748b; font-size: 13px;\">Thanks,<br>The {{platform_name}}\
  \ Team</p>\n    </div>\n</body>\n</html>"
