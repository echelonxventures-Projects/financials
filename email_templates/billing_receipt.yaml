  >\n    <div style=\"background: linear-gradient(135deg, #0891b2, #0e7490); padding:\
  \ 30px; border-radius: 12px 12px 0 0;\">\n        <h1 style=\"color: white; margin:\
  \ 0; font-size: 24px;\">{{platform_name}}</h1>\n    </div>\n    <div style=\"background:\
  \ #f8fafc; padding: 30px; border-radius: 0 0 12px 12px; border: 1px solid #e2e8f0;\
  \ border-top: none;\">\n        <p>Thank you for your payment!</p>\n        <table\
  \ style=\"width: 100%; border-collapse: collapse; margin: 20px 0;\">\n         \
  \   <tr><td style=\"padding: 8px; color: #64748b;\">Plan</td><td style=\"padding:\
  \ 8px; font-weight: 600;\">{{plan_name}}</td></tr>\n            <tr><td style=\"\
