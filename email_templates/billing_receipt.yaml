key: billing_receipt
name: Billing Receipt
version: '2026-11-22'
subject: Your {{platform_name}} receipt - {{amount}} {{currency}}
text_body: 'Hi there,


  Thank you for your payment!


  Plan: {{plan_name}}

  Amount: {{amount}} {{currency}}

  Period: {{period}}


  View your receipt: {{receipt_url}}


  Thanks,

  The {{platform_name}} Team

  '
