key: usage_alert
name: Usage Alert
version: '2026-11-22'
subject: 'Usage alert: {{metric}} at {{percent}}% of limit on {{platform_name}}'
text_body: 'Hi there,


  Your account "{{account_name}}" on {{platform_name}} has reached {{percent}}% of
  its {{metric}} limit.


  Used: {{used}} / {{limit}}


  Consider upgrading your plan for higher limits.


  Thanks,

  The {{platform_name}} Team

  '
html_body: "<!DOCTYPE html>\n<html>\n<body style=\"font-family: system-ui, sans-serif;\
  \ line-height: 1.6; color: #1f2937; max-width: 600px; margin: 0 auto; padding: 20px;\"\
  >\n    <div style=\"background: linear-gradient(135deg, #ea580c, #c2410c); padding:\
  \ 30px; border-radius: 12px 12px 0 0;\">\n        <h1 style=\"color: white; margin:\
  \ 0; font-size: 24px;\">{{platform_name}}</h1>\n    </div>\n    <div style=\"background:\
  \ #f8fafc; padding: 30px; border-radius: 0 0 12px 12px; border: 1px solid #e2e8f0;\
  \ border-top: none;\">\n        <p>Your account <strong>\"{{account_name}}\"</strong>\
  \ has reached <strong>{{percent}}%</strong> of its <strong>{{metric}}</strong> limit.</p>\n\
  \        <div style=\"background: white; padding: 20px; border-radius: 8px; margin:\
  \ 20px 0;\">\n            <div style=\"display: flex; justify-content: space-between;\
  \ margin-bottom: 10px;\">\n                <span>Used</span><span style=\"font-weight:\
  \ 600;\">{{used}}</span>\n            </div>\n            <div style=\"display:\
  \ flex; justify-content: space-between;\">\n                <span>Limit</span><span\
  \ style=\"font-weight: 600;\">{{limit}}</span>\n            </div>\n           \
  \ <div style=\"height: 8px; background: #e2e8f0; border-radius: 4px; margin-top:\
  \ 10px; overflow: hidden;\">\n                <div style=\"height: 100%; width:\
  \ {{percent}}%; background: #ea580c; transition: width 0.3s;\"></div>\n        \
  \    </div>\n        </div>\n        <p>Consider upgrading your plan for higher\
  \ limits.</p>\n        <hr style=\"border: none; border-top: 1px solid #e2e8f0;\
  \ margin: 20px 0;\">\n        <p style=\"color: #64748b; font-size: 13px;\">Thanks,<br>The\
  \ {{platform_name}} Team</p>\n    </div>\n</body>\n</html>"
required_vars:
- platform_name
- metric
- used
- limit
- percent
- account_name
